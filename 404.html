<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirection</title>
    <script type="text/javascript">
      // redirige toutes les requêtes vers index.html tout en gardant le path
      const path = window.location.pathname;
      window.location.replace("/index.html" + path + window.location.search + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
